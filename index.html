<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ezriel Xai's 1st Birthday Invitation</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#087dcc}
body{font-family:Arial,Helvetica,sans-serif}
.page{
  position:fixed; inset:0;
  display:none;
  width:100vw;height:100vh;
  background:#087dcc;
  align-items:center;justify-content:center;
}
.page.active{display:flex}
.art{
  width:100%;height:100%;
  object-fit:contain;
  display:block;
}
.hotspot{
  position:absolute;
  border:0;background:transparent;
  cursor:pointer;
  padding:0;
}
.hotspot:focus-visible{outline:3px solid #fff;outline-offset:4px;border-radius:20px}
#p1Play{left:4%;top:54%;width:37%;height:24%}
#p2Open{left:22%;top:55%;width:57%;height:20%}
#p3Venue{left:50%;top:68%;width:25%;height:13%;transform:translateX(-50%)}
#p3Facebook{left:53%;top:77%;width:18%;height:5%}
#p3Rsvp{left:27%;top:82%;width:46%;height:9%}
#p3Mommy{left:28%;top:91%;width:23%;height:7%}
#p3Daddy{left:51%;top:91%;width:23%;height:7%}
#rsvpModal{
  position:fixed;inset:0;display:none;z-index:20;
  align-items:center;justify-content:center;
  background:rgba(0,0,0,.55);
}
#rsvpModal.show{display:flex}
.modal{
  width:min(92vw,520px);background:#fff;border-radius:24px;
  padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.35);
}
.modal h2{margin:0 0 14px;color:#0759aa}
.modal label{display:block;margin:10px 0 5px;font-weight:700;color:#174c7a}
.modal input,.modal textarea{
  width:100%;padding:12px;border:1px solid #b7d7ee;border-radius:12px;font-size:16px;
}
.modal textarea{min-height:90px;resize:vertical}
.actions{display:flex;gap:10px;margin-top:16px}
.actions button{
  flex:1;border:0;border-radius:12px;padding:13px;font-weight:700;cursor:pointer;
}
.send{background:#087dcc;color:white}.close{background:#e8f1f8;color:#174c7a}
#toast{
 position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
 background:#073d75;color:#fff;padding:12px 18px;border-radius:12px;
 display:none;z-index:30;
}

#countdownModal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,35,75,.62);z-index:40;padding:18px}
#countdownModal.show{display:flex}
.countCard{width:min(430px,94vw);background:#fff;border-radius:24px;padding:26px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.countCard h2{margin:0 0 12px;color:#0759aa}
#countdownValue{font-size:28px;font-weight:900;color:#087dcc;line-height:1.35}

</style>
</head>
<body>

<section class="page active" id="page1">
  <img class="art" src="page1.png" alt="Doraemon birthday invitation cover">
  <button class="hotspot" id="p1Play" aria-label="Play birthday song and continue"></button>
</section>

<section class="page" id="page2">
  <img class="art" src="page2.png" alt="You're invited">
  <button class="hotspot" id="p2Open" aria-label="Open invitation"></button>
</section>

<section class="page" id="page3">
  <img class="art" src="page3.png" alt="Ezriel Xai first birthday invitation">
  <button class="hotspot" id="p3DateTime" aria-label="Show countdown"></button>
  <button class="hotspot" id="p3Venue" aria-label="Open venue in Google Maps"></button>
  <button class="hotspot" id="p3Facebook" aria-label="Open Bella Tamara Facebook"></button>
  <button class="hotspot" id="p3Rsvp" aria-label="Open RSVP form"></button>
  <button class="hotspot" id="p3Mommy" aria-label="Open Mommy Facebook"></button>
  <button class="hotspot" id="p3Daddy" aria-label="Open Daddy Facebook"></button>
</section>

<audio id="music" src="doraemon-theme.wav" preload="auto" loop playsinline></audio>
<audio id="happyMusic" src="happy-birthday.wav" preload="auto" playsinline></audio>

<div id="countdownModal">
  <div class="countCard">
    <h2>🎉 Countdown to Ezriel Xai's Birthday</h2>
    <div id="countdownValue">Loading...</div>
    <button class="close" id="closeCountdown" style="margin-top:18px">Close</button>
  </div>
</div>

<div id="rsvpModal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="rsvpTitle">
    <h2 id="rsvpTitle">💙 RSVP for Ezriel Xai</h2>
    <form id="rsvpForm">
      <label for="guest">Your Name</label>
      <input id="guest" required>
      <label for="count">Number of Guests</label>
      <input id="count" type="number" min="1" value="1" required>
      <label for="message">Message (optional)</label>
      <textarea id="message" placeholder="See you there!"></textarea>
      <div class="actions">
        <button type="button" class="close" id="closeRsvp">Close</button>
        <button type="submit" class="send">Send RSVP</button>
      </div>
    </form>
  </div>
</div>
<div id="toast"></div>

<script>
const pages=[document.getElementById('page1'),document.getElementById('page2'),document.getElementById('page3')];
const music=document.getElementById('music');
const happyMusic=document.getElementById('happyMusic');
music.addEventListener('ended',()=>happyMusic.play().catch(()=>{}));
function showPage(n){
  pages.forEach((p,i)=>p.classList.toggle('active',i===n));
  window.scrollTo(0,0);
}
document.getElementById('p1Play').addEventListener('click', async ()=>{
  music.pause();
  music.currentTime=0;
  happyMusic.currentTime=0;
  try { await happyMusic.play(); } catch(e) { console.log('Mobile audio blocked:', e); }
  showPage(1);
});
document.getElementById('p2Open').addEventListener('click',()=>{
  happyMusic.pause();
  happyMusic.currentTime=0;
  music.currentTime=0;
  music.play().catch(()=>{});
  showPage(2);
});

document.getElementById('p3Venue').addEventListener('click',()=>{
  const q=encodeURIComponent('Bella Tamara Private Resort, Block 1 Lot 17, Montevideo Subdivision, Barangay Mambog, Binangonan, Rizal, Philippines');
  window.open('https://www.google.com/maps/search/?api=1&query='+q,'_blank','noopener');
});
document.getElementById('p3Facebook').addEventListener('click',()=>{
  window.open('https://www.facebook.com/profile.php?id=61581894641011','_blank','noopener,noreferrer');
});
document.getElementById('p3Mommy').addEventListener('click',()=>{
  window.open('https://www.facebook.com/ennaxorsajor','_blank','noopener,noreferrer');
});
document.getElementById('p3Daddy').addEventListener('click',()=>{
  window.open('https://www.facebook.com/emmanzp/','_blank','noopener');
});


const countdownModal=document.getElementById('countdownModal');
const countdownValue=document.getElementById('countdownValue');
const birthdayTarget=new Date('2026-10-03T08:30:00+08:00').getTime();
function updateCountdown(){
  const diff=birthdayTarget-Date.now();
  if(diff<=0){countdownValue.textContent="🎉 It's party time!";return}
  const days=Math.floor(diff/86400000);
  const hours=Math.floor(diff/3600000)%24;
  const minutes=Math.floor(diff/60000)%60;
  const seconds=Math.floor(diff/1000)%60;
  countdownValue.textContent=`${days} Days ${hours} Hours ${minutes} Minutes ${seconds} Seconds`;
}
document.getElementById('p3DateTime').addEventListener('click',()=>{
  updateCountdown();
  countdownModal.classList.add('show');
});
document.getElementById('closeCountdown').addEventListener('click',()=>countdownModal.classList.remove('show'));
setInterval(updateCountdown,1000);

const modal=document.getElementById('rsvpModal');
document.getElementById('p3Rsvp').addEventListener('click',()=>modal.classList.add('show'));
document.getElementById('closeRsvp').addEventListener('click',()=>modal.classList.remove('show'));
modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('show')});

document.getElementById('rsvpForm').addEventListener('submit',e=>{
  e.preventDefault();
  const name=document.getElementById('guest').value.trim();
  const count=document.getElementById('count').value;
  const msg=document.getElementById('message').value.trim();
  const text=`RSVP - Ezriel Xai's 1st Birthday%0AName: ${encodeURIComponent(name)}%0AGuests: ${encodeURIComponent(count)}%0AMessage: ${encodeURIComponent(msg)}`;
  // Opens the user's email app; replace the address below with the host's email if desired.
  window.location.href=`mailto:?subject=RSVP%20-%20Ezriel%20Xai%27s%201st%20Birthday&body=${text}`;
  modal.classList.remove('show');
});

document.addEventListener('keydown',e=>{
  if(e.key==='Escape') modal.classList.remove('show');
  if(e.key==='ArrowRight' && document.getElementById('page1').classList.contains('active')) showPage(1);
  else if(e.key==='ArrowRight' && document.getElementById('page2').classList.contains('active')) showPage(2);
  else if(e.key==='ArrowLeft' && document.getElementById('page3').classList.contains('active')) showPage(1);
  else if(e.key==='ArrowLeft' && document.getElementById('page2').classList.contains('active')) showPage(0);
});
</script>
</body>
</html>
